<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#050b16">
  <meta name="description" content="Área administrativa do Diogenes Northeastern Technology.">

  <title>Acesso Administrativo | Diogenes Northeastern Technology</title>

  <link rel="icon" href="images/logo-diogenes.png">
  <link rel="stylesheet" href="admin.css">

  <script src="admin.js" defer></script>
</head>

<body>

  <!-- CABEÇALHO -->
  <header class="topo-admin">

    <a href="index.html" class="voltar-site">
      ← Voltar ao site principal
    </a>

    <a href="index.html" class="marca-admin">
      <img src="images/logo-diogenes.png" alt="Logo Diogenes">

      <span>
        <strong>Diogenes</strong>
        <small>Northeastern Technology</small>
      </span>
    </a>

  </header>

  <!-- CONTEÚDO PRINCIPAL -->
  <main class="principal-admin">

    <section class="cartao-login">

      <div class="icone-cadeado">
        <svg
          viewBox="0 0 24 24"
          width="29"
          height="29"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <rect x="4" y="10" width="16" height="11" rx="2"></rect>
          <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
          <path d="M12 14v3"></path>
        </svg>
      </div>

      <span class="etiqueta-admin">ÁREA RESTRITA</span>

      <h1>Acesso administrativo</h1>

      <p class="descricao-login">
        Entre para gerenciar as publicações do seu site.
      </p>

      <form id="login-form" class="formulario-login">

        <label for="senha">Senha de acesso</label>

        <div class="campo-senha">

          <input
            type="password"
            id="senha"
            name="senha"
            placeholder="Digite sua senha"
            autocomplete="current-password"
            required
          >

          <button
            type="button"
            id="mostrar-senha"
            class="botao-olho"
            aria-label="Mostrar senha"
            title="Mostrar ou ocultar senha"
          >
            <svg
              class="icone-olho"
              viewBox="0 0 24 24"
              width="21"
              height="21"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>

        </div>

        <p id="login-mensagem" class="mensagem-login" aria-live="polite"></p>

        <button type="submit" class="botao-entrar">
          <span>Entrar no painel</span>
          <span class="seta-entrar">→</span>
        </button>

      </form>

      <div class="aviso-restrito">
        <span class="ponto-verde"></span>
        <span>Acesso à área administrativa</span>
      </div>

    </section>

  </main>

  <!-- RODAPÉ -->
  <footer class="rodape-admin">
    <p>
      © <span id="ano"></span> Diogenes Northeastern Technology
    </p>

    <span>
      Tecnologia, inovação e raízes nordestinas.
    </span>
  </footer>

  <script>
    document.getElementById("ano").textContent =
      new Date().getFullYear();
  </script>

</body>
</html>
